<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Brand mark for SYNC.MGMT.
       Warm near-black surface + CRT-amber accents matching the app palette. -->
  <rect width="64" height="64" fill="#0a0b08"/>

  <!-- Corner brackets (top-left + bottom-right) mirror the modal/output-card decorations -->
  <path d="M4 4 H17 M4 4 V17" stroke="#ffb000" stroke-width="3" stroke-linecap="square" fill="none"/>
  <path d="M60 60 H47 M60 60 V47" stroke="#ffb000" stroke-width="3" stroke-linecap="square" fill="none"/>

  <!-- Three amber stripes = data streaming between source and destination -->
  <rect x="14" y="20" width="36" height="5" fill="#ffb000"/>
  <rect x="14" y="29.5" width="36" height="5" fill="#ffb000" opacity="0.7"/>
  <rect x="14" y="39" width="36" height="5" fill="#ffb000" opacity="0.45"/>

  <!-- Sync cursor: a tiny amber square aligned with the title-cursor blink in the app -->
  <rect x="51" y="20" width="3" height="14" fill="#ffce5a"/>
</svg>
